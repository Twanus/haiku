[package]
name = "haiku"
version = "0.1.0"
edition = "2021"
description = "A CLI for writing, checking, and collecting haikus"
license = "MIT"
repository = "https://github.com/Twanus/haiku"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
rustyline = "18.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
