[package]
name = "haiku"
version = "0.1.0"
edition = "2021"
description = "A CLI for writing, checking, and collecting haikus"
license = "MIT"
repository = "https://github.com/Twanus/haiku"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
rustyline = "18.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
