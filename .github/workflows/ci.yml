name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Pick up new RustSec advisories even when Cargo.lock hasn't changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  promote:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_SSH_KEY }}
      - name: Fast-forward main to this green commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main has commits not in this green dev commit; refusing a non-fast-forward promote"
            git log --oneline HEAD..origin/main
            exit 1
          fi
          git push origin HEAD:refs/heads/main

  build-release:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [promote]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: haiku-x86_64-unknown-linux-gnu
            src: haiku
          - os: windows-latest
            artifact: haiku-x86_64-pc-windows-msvc.exe
            src: haiku.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package binary
        shell: bash
        run: |
          src="target/release/${{ matrix.src }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "$src"
          fi
          mv "$src" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          files: dist/*
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Binaries from `${{ github.sha }}`, published after tests and cargo audit passed on `dev`.

            - `haiku-x86_64-unknown-linux-gnu` — Linux
            - `haiku-x86_64-pc-windows-msvc.exe` — Windows
