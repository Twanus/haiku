# Pipeline shape:
#
#   test ─┐
#   audit ─┼─→ promote
#   lint ──┘
#
# test/audit/lint gate everything and run on every push, PR, and the
# weekly schedule; promote fast-forwards main once all three are green.
# This workflow never builds a release binary — that's release.yml,
# triggered only by pushing a version tag (see its own header comment
# for why). promote only runs for a push to dev (or a manual dispatch
# against dev) — never for main or a pull request.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Pick up new RustSec advisories even when Cargo.lock hasn't changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Safe to cancel a superseded PR run mid-flight (it's just tests). Never
  # cancel a push-triggered run in flight instead: that pipeline reaches
  # promote, and cutting it off partway through is worse than letting it
  # finish and simply queuing the next one behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies against RustSec
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  promote:
    name: Promote to main
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, audit, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with promote deploy key)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_SSH_KEY }}
      - name: Fast-forward main to this green commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main has commits not in this green dev commit; refusing a non-fast-forward promote"
            git log --oneline HEAD..origin/main
            exit 1
          fi
          git push origin HEAD:refs/heads/main
